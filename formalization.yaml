# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Three IM and one CM shared values"
  description: >-
    Two nonconstant meromorphic functions on the complex plane sharing four
    pairwise distinct Riemann-sphere values, three IM and one CM, share all
    four values CM, without a growth assumption.
  authors: ["Pengcheng Fang", "Tao Hu", "Yanyang Li", "Quanyu Tang", "Haiqi Zhang"]
  license: "Apache-2.0"
  responsible_maintainers: ["Quanyu Tang"]

classification:
  arxiv: ["math.CV"]
  msc2020: ["30D35", "30D45"]

sources:
  - title: "On meromorphic functions sharing three values IM and one value CM"
    authors: ["Pengcheng Fang", "Tao Hu", "Yanyang Li", "Quanyu Tang", "Haiqi Zhang"]
    type: "unpublished manuscript"
    location: "Main theorem, labelled thm:main"
    relationship: "formalizes"
    note: >-
      The article is currently being written. The informal proof was
      developed with assistance from ChatGPT. Quanyu Tang was responsible
      for formalizing that proof using Aristotle and
      Codex as formalization tools. The manuscript and its TeX source are
      not distributed here.

status:
  scope: >-
    The full unconditional main theorem, with meromorphic germ multiplicities
    and infinity included. The substantive proof and Solution contain no
    unresolved holes. Challenge contains one deliberate theorem placeholder,
    excluded from the substantive proof counts under the metadata schema.
    CI runs the official Comparator and independent kernels; its actual
    workflow results determine that check's outcome. No Palomar registration
    is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ThreeIMOneCM.three_IM_one_CM"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "copilot"
      framework: "ChatGPT"
      tool_setup: "Assistance in developing the informal proof."
    - method: "agent"
      framework: "Aristotle"
      tool_setup: >-
        Used by Quanyu Tang as a formalization tool for the initial Lean
        development based on the informal proof.
    - method: "agent"
      framework: "Codex"
      tool_setup: >-
        Used by Quanyu Tang as a formalization tool for continuation, repair,
        and extension of the Lean development, statement and definition
        comparisons, compilation, and axiom audits.
      prompting_notes: >-
        Complete the original unconditional assertion without adding
        intermediate growth, classification, or compactness hypotheses.
  notes: >-
    Quanyu Tang is responsible for the formalization based on the original
    informal proof, which was developed with assistance from ChatGPT.
    Aristotle and Codex are the formalization tools used by Quanyu Tang.
    Tool involvement does not constitute human author review or peer review.

fidelity:
  divergences: >-
    The advertised statement and germ-based definitions retain the manuscript's
    meaning. There are no additional growth, finite-order, periodicity, defect,
    stable-expansion, or distinctness assumptions. The formal proof reorganizes
    some arguments, including critical-defect exclusion, where rational
    exponents are needed within that contradiction rather than as a universal
    classification of all exponential sharing pairs. This is a proof-level
    change, not a weakened theorem.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    Agent reviews compared the original statement and definitions with the
    manuscript and inspected actual compilation, proof-dependency axioms,
    and source and artifact hashes. No completed human author review,
    independent peer review, or Palomar mechanical or editorial approval
    is claimed. Consult actual CI results for Linux Comparator verification.

alignment:
  namespace: "ThreeIMOneCM"
  statements:
    - source: "Main theorem of the authors' manuscript, labelled thm:main"
      lean: "ThreeIMOneCM.three_IM_one_CM"
      module: "Challenge.lean and Solution.lean"
      note: >-
        Challenge and Solution independently declare the same statement and
        the same five necessary definitions. Explicit definitional equivalences
        connect Solution to the substantive ThreeIM theorem. Comparator
        definition_names is empty; definition bodies are not exempted from
        its ordinary comparison.

acknowledgements: >-
  Lean and Mathlib; ChatGPT for assistance in developing the informal proof;
  Aristotle and Codex as the tools used by Quanyu Tang
  for the formalization based on that proof. The included sphere
  and normal-family modules adapt Will (Ziang) Li's no-wandering-domains at
  commit 0a6497b0cc9ed39a6a705bf013449635894b56d0 under Apache-2.0; the
  original headers, license, and NoWanderingDomains/ORIGIN.md are preserved.
  PicardSupport adapts elementary estimates from Stefan Kebekus's ProjectVD
  at commit 5606b50ee6348c502410a0526be26e0dac7a1bc2 under Apache-2.0,
  with its original source attribution retained.
